<html lang="ru">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Romantic Love Story</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #2a081a 0%, #150510 100%);
            --card-bg: rgba(255, 240, 245, 0.07);
            --card-border: rgba(255, 182, 193, 0.25);
            --rose-gold: #f7a8b8;
            --rose-accent: #ff4d6d;
            --gold-glow: #ffb7b2;
            --text-main: #fff0f5;
            --text-sub: #d8b4e2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            padding: 24px 14px 90px 14px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* --- ФОНОВЫЕ ПАРЯЩИЕ СЕРДЕЧКИ --- */
        .hearts-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart-particle {
            position: absolute;
            color: var(--rose-gold);
            opacity: 0.3;
            font-size: 16px;
            animation: floatHeart 12s infinite ease-in-out;
        }

        @keyframes floatHeart {
            0% { transform: translateY(105vh) scale(0.8) rotate(0deg); opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(45deg); opacity: 0; }
        }

        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
        }

        /* --- РОМАНТИЧЕСКИЕ КАРТОЧКИ --- */
        .love-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* --- ПРОФИЛИ В ВИНТАЖНОЙ РАМКЕ --- */
        .profiles-deck {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .profile-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-frame {
            position: relative;
            padding: 4px;
            background: linear-gradient(135deg, var(--rose-gold), var(--rose-accent));
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.3);
        }

        .avatar {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 2px solid #1a0512;
        }

        .profile-name {
            margin-top: 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .center-heart {
            text-align: center;
        }

        .big-heart {
            font-size: 34px;
            color: var(--rose-accent);
            filter: drop-shadow(0 0 12px var(--rose-accent));
            animation: pulseGlow 1.6s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px var(--rose-accent)); }
            50% { transform: scale(1.18); filter: drop-shadow(0 0 18px var(--rose-accent)); }
        }

        .days-count-heart {
            font-size: 14px;
            font-weight: 700;
            color: var(--rose-gold);
            margin-top: 4px;
        }

        /* --- ПРОГРЕСС-БАР --- */
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .progress-track {
            height: 14px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 2px;
            border: 1px solid var(--card-border);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--rose-gold), var(--rose-accent));
            border-radius: 20px;
            box-shadow: 0 0 10px var(--rose-accent);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- ФОТО ПОД ШКАЛОЙ --- */
        .main-photo-card {
            padding: 10px;
            border-radius: 24px;
            overflow: hidden;
        }

        .photo-card-inner {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .photo-card-inner img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        /* --- ГЛАВНЫЙ СЧЕТЧИК И РЕДАКТИРУЕМЫЙ ТИТУЛ --- */
        .main-timer {
            text-align: center;
            padding: 16px;
        }

        .editable-title {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .editable-title:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .timer-title-text {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--rose-gold);
            font-weight: 600;
        }

        .timer-value {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 6px;
            text-shadow: 0 0 10px rgba(255, 183, 178, 0.4);
        }

        /* --- СПИСОК ДАТ --- */
        .events-scroll {
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .events-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .events-scroll::-webkit-scrollbar-thumb {
            background: var(--rose-gold);
            border-radius: 10px;
        }

        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .event-item.holiday {
            background: rgba(255, 77, 109, 0.12);
            border-color: rgba(255, 77, 109, 0.3);
        }

        .event-name {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .event-tag {
            font-size: 12px;
            font-weight: 700;
            color: var(--rose-gold);
            text-align: right;
        }

        .event-subdate {
            font-size: 10px;
            color: var(--text-sub);
            font-weight: normal;
        }

        /* --- КНОПКА ПОЦЕЛУЯ --- */
        .fab-heart {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--rose-accent), var(--rose-gold));
            border: none;
            color: #ffffff;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.5);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        .fab-heart:active {
            transform: scale(0.9);
        }
    </style>
</head>

        function parseDate(dateStr) {
            const parts = dateStr.split('.');
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            const now = new Date();

            eventsData.forEach(item => {
                const itemDate = parseDate(item.date);
                const diffTime = itemDate - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let daysLabel = diffDays > 0 ? `X-${diffDays}` : (diffDays === 0 ? `Сегодня! 🎉` : `X+${Math.abs(diffDays)}`);

                const eventEl = document.createElement('div');
                eventEl.className = `event-item ${item.isHoliday ? 'holiday' : ''}`;
                eventEl.innerHTML = `
                    <div class="event-name"><span>${item.icon}</span> ${item.title}</div>
                    <div class="event-tag">
                        ${daysLabel}
                        <div class="event-subdate">${item.date}</div>
                    </div>
                `;
                container.appendChild(eventEl);
            });
        }

        function updateCounters() {
            const now = new Date();
            const diffInMs = now - startDate;
            if (diffInMs < 0) return;
            
            const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
            document.getElementById('total-days-heart').textContent = `${diffInDays} дней`;

            let yearsDiff = now.getFullYear() - startDate.getFullYear();
            let monthsDiff = now.getMonth() - startDate.getMonth();
            let daysDiff = now.getDate() - startDate.getDate();

            if (daysDiff < 0) {
                monthsDiff--;
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                daysDiff += prevMonth.getDate();
            }
            if (monthsDiff < 0) {
                yearsDiff--;
                monthsDiff += 12;
            }

            let mainCounterStr = "";
            if (yearsDiff > 0) mainCounterStr += `${yearsDiff}г `;
            if (monthsDiff > 0) mainCounterStr += `${monthsDiff}м `;
            mainCounterStr += `${daysDiff} дней`;
            document.getElementById('main-counter-value').textContent = mainCounterStr;

            let progressDays = diffInDays >= targetGoalDays ? targetGoalDays : diffInDays;
            const percent = Math.floor((progressDays / targetGoalDays) * 100);
            
            document.getElementById('progress-fill').style.width = `${percent}%`;

            const daysLeft = targetGoalDays - diffInDays;
            document.getElementById('days-to-goal').textContent = daysLeft > 0 ? `Осталось: ${daysLeft}д` : `Цель достигнута! 💕`;
        }

        renderEvents();
        updateCounters();
        setInterval(updateCounters, 60000);

        // Салюты из сердечек
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 4 + 3;
                this.speedX = (Math.random() - 0.5) * 6;
                this.speedY = (Math.random() - 0.5) * 6;
                this.color = ['#ff4d6d', '#f7a8b8', '#ffffff', '#ffb7b2'][Math.floor(Math.random() * 4)];
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.012;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.05;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createFirework(x, y) {
            for (let i = 0; i < 35; i++) particles.push(new Particle(x, y));
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('pointerdown', (e) => createFirework(e.clientX, e.clientY));
        document.getElementById('fab-kiss').addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = e.target.getBoundingClientRect();
            createFirework(rect.left + rect.width / 2, rect.top + rect.height / 2);
        });
    </script>
</body>
</html>
