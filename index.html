    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <style>
        /* --- КОРНЕВЫЕ ПЕРЕМЕННЫЕ --- */
        :root {
            --primary-bg: #0a0508;
            --card-bg: #140810;
            --neon-pink-bright: #ff007f;
            --neon-pink-light: #ff66b2;
            --neon-pink-glow: rgba(255, 0, 127, 0.6);
            --neon-pink-soft-glow: rgba(255, 0, 127, 0.25);
            --progress-bg: #2a0c1d;
            --border-color: #4a1031;
        }

        /* --- СБРОС СТИЛЕЙ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--neon-pink-light);
            padding-top: 20px;
            padding-bottom: 90px;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* --- АНИМИРОВАННЫЙ ФОН --- */
        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-item {
            position: absolute;
            color: var(--neon-pink-bright);
            opacity: 0.2;
            font-size: 18px;
            animation: floatUp 8s infinite linear;
            text-shadow: 0 0 8px var(--neon-pink-glow);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* --- CANVAS САЛЮТА --- */
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* --- КОНТЕНТ --- */
        .content {
            position: relative;
            z-index: 1;
        }

        /* --- БЛОК ПРОФИЛЕЙ --- */
        .profiles-container {
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .profile-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100px;
        }

        .avatar-wrapper {
            position: relative;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-pink-bright);
            box-shadow: 0 0 14px var(--neon-pink-glow);
        }

        .avatar-kiss {
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 18px;
            filter: drop-shadow(0 0 6px var(--neon-pink-bright));
            animation: pulseKiss 2s infinite ease-in-out;
        }

        @keyframes pulseKiss {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .profile-name {
            margin-top: 8px;
            font-size: 14px;
            color: var(--neon-pink-light);
            font-weight: 600;
            text-shadow: 0 0 6px var(--neon-pink-soft-glow);
        }

        .heart-counter {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .heart-icon {
            font-size: 36px;
            color: var(--neon-pink-bright);
            text-shadow: 0 0 16px var(--neon-pink-glow);
            animation: heartBeat 1.5s infinite ease-in-out;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
        }

        .heart-days {
            margin-top: 2px;
            font-size: 16px;
            font-weight: 700;
            color: var(--neon-pink-bright);
            text-shadow: 0 0 8px var(--neon-pink-glow);
        }

        .center-kiss {
            font-size: 14px;
            margin-top: 2px;
            opacity: 0.9;
        }

        /* --- ПРОГРЕСС-БАР --- */
        .progress-section {
            padding: 0 16px;
            margin-top: 16px;
            position: relative;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--neon-pink-light);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .progress-label-right {
            color: var(--neon-pink-bright);
            font-weight: 700;
        }

        .progress-bar-container {
            height: 14px;
            background-color: var(--progress-bg);
            border: 1px solid var(--border-color);
            border-radius: 7px;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff007f, #ff66b2);
            box-shadow: 0 0 12px var(--neon-pink-glow);
            border-radius: 7px;
            position: relative;
            transition: width 0.5s ease-out;
        }

        .progress-badge {
            position: absolute;
            right: -20px;
            top: -28px;
            background-color: var(--neon-pink-bright);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 6px;
            border-radius: 4px;
            white-space: nowrap;
            box-shadow: 0 0 10px var(--neon-pink-glow);
        }

        .progress-badge::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0 5px;
            border-style: solid;
            border-color: var(--neon-pink-bright) transparent transparent transparent;
        }

        /* --- ГЛАВНЫЙ СЧЕТЧИК --- */
        .main-counter {
            padding: 28px 16px;
            text-align: center;
        }

        .counter-name {
            font-size: 16px;
            color: var(--neon-pink-light);
            margin-bottom: 6px;
        }

        .counter-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--neon-pink-bright);
            text-shadow: 0 0 14px var(--neon-pink-glow);
        }

        /* --- ФОТОГРАФИЯ --- */
        .photo-section {
            width: 100%;
            overflow: hidden;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 0 18px var(--neon-pink-soft-glow);
        }

        .couple-photo {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- ПОЛНЫЙ СПИСОК СОБЫТИЙ --- */
        .event-list {
            padding: 0 16px;
            margin-top: 24px;
        }

        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-top: 1px solid var(--border-color);
        }

        .event-title {
            font-size: 15px;
            color: var(--neon-pink-light);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .event-title .icon {
            font-size: 18px;
        }

        .event-details {
            text-align: right;
        }

        .event-date {
            font-size: 12px;
            color: rgba(255, 102, 178, 0.7);
            margin-bottom: 2px;
        }

        .event-days {
            font-size: 13px;
            color: var(--neon-pink-bright);
            font-weight: 700;
            text-shadow: 0 0 6px var(--neon-pink-glow);
        }

        /* ПАМЯТНЫЕ ПРАЗДНИКИ (ВЫДЕЛЕНИЕ) */
        .event-item.holiday .event-title {
            color: #ffffff;
            text-shadow: 0 0 8px var(--neon-pink-bright);
        }

        /* --- КНОПКА ФЛОАТИРОВАНИЯ --- */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #ff007f, #ff3399);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-pink-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 26px;
            border: none;
            cursor: pointer;
            z-index: 1000;
            animation: fabPulse 2s infinite ease-in-out;
        }

        @keyframes fabPulse {
            0%, 100% { box-shadow: 0 0 15px var(--neon-pink-glow); }
            50% { box-shadow: 0 0 28px var(--neon-pink-bright); }
        }
    </style>
</head>

        function parseDate(dateStr) {
            const parts = dateStr.split('.');
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            const now = new Date();

            eventsData.forEach(item => {
                const itemDate = parseDate(item.date);
                const diffTime = itemDate - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let daysLabel = "";
                if (diffDays > 0) {
                    daysLabel = `X-${diffDays}`;
                } else if (diffDays === 0) {
                    daysLabel = `Сегодня! 🎉`;
                } else {
                    daysLabel = `X+${Math.abs(diffDays)}`;
                }

                const eventEl = document.createElement('div');
                eventEl.className = `event-item ${item.isHoliday ? 'holiday' : ''}`;
                eventEl.innerHTML = `
                    <div class="event-title">
                        <span class="icon">${item.icon}</span> ${item.title}
                    </div>
                    <div class="event-details">
                        <div class="event-date">${item.date}</div>
                        <div class="event-days">${daysLabel}</div>
                    </div>
                `;
                container.appendChild(eventEl);
            });
        }

        function updateCounters() {
            const now = new Date();
            const diffInMs = now - startDate;
            if (diffInMs < 0) return;
            
            const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));

            document.getElementById('total-days-heart').textContent = `${diffInDays}дней`;

            let yearsDiff = now.getFullYear() - startDate.getFullYear();
            let monthsDiff = now.getMonth() - startDate.getMonth();
            let daysDiff = now.getDate() - startDate.getDate();

            if (daysDiff < 0) {
                monthsDiff--;
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                daysDiff += prevMonth.getDate();
            }
            if (monthsDiff < 0) {
                yearsDiff--;
                monthsDiff += 12;
            }

            let mainCounterStr = "";
            if (yearsDiff > 0) mainCounterStr += `${yearsDiff}г `;
            if (monthsDiff > 0) mainCounterStr += `${monthsDiff}месяц `;
            mainCounterStr += `${daysDiff}дней`;
            document.getElementById('main-counter-value').textContent = mainCounterStr;

            let progressDays = diffInDays >= targetGoalDays ? targetGoalDays : diffInDays;
            const percent = Math.floor((progressDays / targetGoalDays) * 100);
            
            document.getElementById('progress-fill').style.width = `${percent}%`;
            document.getElementById('progress-percent').textContent = `${percent}%`;

            const daysLeft = targetGoalDays - diffInDays;
            if (daysLeft > 0) {
                document.getElementById('days-to-goal').textContent = `X-${daysLeft}`;
            } else {
                document.getElementById('days-to-goal').textContent = `Достигнуто! 🎉`;
            }
        }

        renderEvents();
        updateCounters();
        setInterval(updateCounters, 60000);

        // --- ИНТЕРАКТИВНЫЙ САЛЮТ ---
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.color = ['#ff007f', '#ff66b2', '#ffffff', '#ffb3d9', '#ff3399'][Math.floor(Math.random() * 5)];
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.symbol = Math.random() > 0.6 ? (Math.random() > 0.5 ? '✨' : '💖') : null;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.08;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                if (this.symbol) {
                    ctx.font = `${this.size * 3}px sans-serif`;
                    ctx.fillText(this.symbol, this.x, this.y);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function createFirework(x, y) {
            for (let i = 0; i < 35; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('pointerdown', (e) => createFirework(e.clientX, e.clientY));

        document.getElementById('fab-kiss').addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = e.target.getBoundingClientRect();
            createFirework(rect.left + rect.width / 2, rect.top + rect.height / 2);
        });

        setTimeout(() => {
            createFirework(window.innerWidth / 2, window.innerHeight / 3);
        }, 500);
    </script>
</body>
</html>
