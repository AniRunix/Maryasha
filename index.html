    <style>
        :root {
            --bg-dark: #050308;
            --cyber-pink: #ff0055;
            --cyber-pink-glow: rgba(255, 0, 85, 0.4);
            --cyber-cyan: #00f0ff;
            --cyber-cyan-glow: rgba(0, 240, 255, 0.3);
            --panel-bg: rgba(18, 10, 26, 0.75);
            --panel-border: rgba(255, 0, 85, 0.3);
            --text-main: #e0f7fc;
            --text-dim: #8a7a99;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Courier New", Courier, monospace, system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 16px 12px 90px 12px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.15), transparent 70%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- HEADER HUD --- */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--cyber-pink);
            padding-bottom: 8px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
            color: var(--cyber-cyan);
            text-shadow: 0 0 6px var(--cyber-cyan-glow);
        }

        .hud-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--cyber-pink);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyber-pink);
            animation: blink 1s infinite alternate;
        }

        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

        /* --- CYBER PANEL STYLE --- */
        .cyber-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
            padding: 14px;
            margin-bottom: 14px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.05);
        }

        .cyber-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 6px; height: 6px;
            background: var(--cyber-cyan);
        }

        /* --- DASHBOARD GRID (2x2) --- */
        .dash-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 10px 6px;
        }

        .avatar-box {
            position: relative;
            width: 64px;
            height: 64px;
            margin-bottom: 6px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 1px solid var(--cyber-cyan);
            clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%);
        }

        .avatar-tag {
            position: absolute;
            bottom: -6px;
            right: -6px;
            background: var(--cyber-pink);
            color: #fff;
            font-size: 9px;
            padding: 1px 4px;
            font-weight: bold;
        }

        .profile-name {
            font-size: 12px;
            font-weight: bold;
            color: var(--cyber-cyan);
            text-transform: uppercase;
        }

        /* --- HEART CORE --- */
        .core-widget {
            grid-column: span 2;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255, 0, 85, 0.06);
            border: 1px dashed var(--cyber-pink);
            padding: 10px;
        }

        .core-heart {
            font-size: 28px;
            color: var(--cyber-pink);
            filter: drop-shadow(0 0 10px var(--cyber-pink));
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        .core-value {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 8px var(--cyber-pink);
        }

        /* --- PROGRESS BAR --- */
        .progress-box {
            margin-bottom: 14px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .bar-outer {
            height: 12px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid var(--cyber-cyan);
            position: relative;
            padding: 1px;
        }

        .bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--cyber-pink), var(--cyber-cyan));
            box-shadow: 0 0 10px var(--cyber-cyan);
            transition: width 0.5s ease;
        }

        /* --- COUNTER DISPLAY --- */
        .main-timer {
            text-align: center;
            border-left: 3px solid var(--cyber-cyan);
            padding: 10px;
        }

        .timer-label {
            font-size: 10px;
            color: var(--cyber-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-val {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* --- TABS SYSTEM --- */
        .tab-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            color: var(--text-dim);
            padding: 8px;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--cyber-pink);
            color: #fff;
            border-color: var(--cyber-pink);
            box-shadow: 0 0 12px var(--cyber-pink-glow);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* --- PHOTO CORE --- */
        .photo-container {
            text-align: center;
            position: relative;
            padding: 6px;
            border: 1px solid var(--cyber-cyan);
        }

        .photo-container img {
            width: 100%;
            display: block;
            filter: contrast(1.05) brightness(0.95);
        }

        /* --- TIMELINE LIST --- */
        .events-list {
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .events-list::-webkit-scrollbar {
            width: 4px;
        }
        .events-list::-webkit-scrollbar-thumb {
            background: var(--cyber-pink);
        }

        .event-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 2px solid var(--text-dim);
            font-size: 12px;
        }

        .event-row.holiday {
            border-left-color: var(--cyber-pink);
            background: rgba(255, 0, 85, 0.08);
        }

        .event-title {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        .event-days {
            color: var(--cyber-cyan);
            font-weight: bold;
        }

        /* --- FAB BUTTON --- */
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: var(--cyber-pink);
            border: none;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            box-shadow: 0 0 20px var(--cyber-pink);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

        function parseDate(dateStr) {
            const parts = dateStr.split('.');
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            const now = new Date();

            eventsData.forEach(item => {
                const itemDate = parseDate(item.date);
                const diffTime = itemDate - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let daysLabel = diffDays > 0 ? `X-${diffDays}` : (diffDays === 0 ? `Сегодня!` : `X+${Math.abs(diffDays)}`);

                const eventEl = document.createElement('div');
                eventEl.className = `event-row ${item.isHoliday ? 'holiday' : ''}`;
                eventEl.innerHTML = `
                    <div class="event-title"><span>${item.icon}</span> ${item.title}</div>
                    <div class="event-days">${daysLabel} <span style="font-size:9px; color:var(--text-dim);">(${item.date})</span></div>
                `;
                container.appendChild(eventEl);
            });
        }

        function updateCounters() {
            const now = new Date();
            const diffInMs = now - startDate;
            if (diffInMs < 0) return;
            
            const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
            document.getElementById('total-days-heart').textContent = `${diffInDays} дн.`;

            let yearsDiff = now.getFullYear() - startDate.getFullYear();
            let monthsDiff = now.getMonth() - startDate.getMonth();
            let daysDiff = now.getDate() - startDate.getDate();

            if (daysDiff < 0) {
                monthsDiff--;
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                daysDiff += prevMonth.getDate();
            }
            if (monthsDiff < 0) {
                yearsDiff--;
                monthsDiff += 12;
            }

            let mainCounterStr = "";
            if (yearsDiff > 0) mainCounterStr += `${yearsDiff}г `;
            if (monthsDiff > 0) mainCounterStr += `${monthsDiff}м `;
            mainCounterStr += `${daysDiff}дней`;
            document.getElementById('main-counter-value').textContent = mainCounterStr;

            let progressDays = diffInDays >= targetGoalDays ? targetGoalDays : diffInDays;
            const percent = Math.floor((progressDays / targetGoalDays) * 100);
            
            document.getElementById('progress-fill').style.width = `${percent}%`;

            const daysLeft = targetGoalDays - diffInDays;
            document.getElementById('days-to-goal').textContent = daysLeft > 0 ? `Осталось: ${daysLeft}д` : `Цель достигнута!`;
        }

        renderEvents();
        updateCounters();
        setInterval(updateCounters, 60000);

        // Салюты
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 3 + 2;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.color = ['#ff0055', '#00f0ff', '#ffffff'][Math.floor(Math.random() * 3)];
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.08;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createFirework(x, y) {
            for (let i = 0; i < 30; i++) particles.push(new Particle(x, y));
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('pointerdown', (e) => createFirework(e.clientX, e.clientY));
        document.getElementById('fab-kiss').addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = e.target.getBoundingClientRect();
            createFirework(rect.left + rect.width / 2, rect.top + rect.height / 2);
        });
    </script>
</body>
</html>
