<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- === ЗАПРЕТ КЭШИРОВАНИЯ === -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Couple App (Neon Hearts & Kisses)</title>
    <style>
        /* --- КОРНЕВЫЕ ПЕРЕМЕННЫЕ --- */
        :root {
            --primary-bg: #0a0508;
            --card-bg: #140810;
            --neon-pink-bright: #ff007f;
            --neon-pink-light: #ff66b2;
            --neon-pink-glow: rgba(255, 0, 127, 0.6);
            --neon-pink-soft-glow: rgba(255, 0, 127, 0.25);
            --progress-bg: #2a0c1d;
            --border-color: #4a1031;
        }

        /* --- СБРОС СТИЛЕЙ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--neon-pink-light);
            padding-top: 20px;
            padding-bottom: 80px;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- АНИМИРОВАННЫЙ ФОН С СЕРДЕЧКАМИ --- */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-heart {
            position: absolute;
            color: var(--neon-pink-bright);
            opacity: 0.15;
            font-size: 20px;
            animation: floatUp 8s infinite linear;
            text-shadow: 0 0 8px var(--neon-pink-glow);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.25;
            }
            80% {
                opacity: 0.25;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* --- ОСНОВНОЙ КОНТЕНТ --- */
        .content {
            position: relative;
            z-index: 1;
        }

        /* --- БЛОК ПРОФИЛЕЙ И СЕРДЦА --- */
        .profiles-container {
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .profile-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100px;
            position: relative;
        }

        .avatar-wrapper {
            position: relative;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-pink-bright);
            box-shadow: 0 0 14px var(--neon-pink-glow);
        }

        .avatar-kiss {
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 18px;
            filter: drop-shadow(0 0 6px var(--neon-pink-bright));
            animation: pulseKiss 2s infinite ease-in-out;
        }

        @keyframes pulseKiss {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .profile-name {
            margin-top: 8px;
            font-size: 14px;
            color: var(--neon-pink-light);
            font-weight: 600;
            text-shadow: 0 0 6px var(--neon-pink-soft-glow);
        }

        .heart-counter {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .heart-icon {
            font-size: 36px;
            color: var(--neon-pink-bright);
            text-shadow: 0 0 16px var(--neon-pink-glow);
            animation: heartBeat 1.5s infinite ease-in-out;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
        }

        .heart-days {
            margin-top: 2px;
            font-size: 16px;
            font-weight: 700;
            color: var(--neon-pink-bright);
            text-shadow: 0 0 8px var(--neon-pink-glow);
        }

        .center-kiss {
            font-size: 14px;
            margin-top: 2px;
            opacity: 0.9;
            filter: drop-shadow(0 0 4px var(--neon-pink-bright));
        }

        /* --- ПРОГРЕСС-БАР И ЗНАЧОК --- */
        .progress-section {
            padding: 0 16px;
            margin-top: 16px;
            position: relative;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--neon-pink-light);
            font-weight: 600;
            margin-bottom: 6px;
            text-shadow: 0 0 5px var(--neon-pink-soft-glow);
        }

        .progress-label-right {
            color: var(--neon-pink-bright);
            font-weight: 700;
        }

        .progress-bar-container {
            height: 14px;
            background-color: var(--progress-bg);
            border: 1px solid var(--border-color);
            border-radius: 7px;
            position: relative;
            overflow: visible;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff007f, #ff66b2);
            box-shadow: 0 0 12px var(--neon-pink-glow);
            border-radius: 7px;
            position: relative;
            transition: width 0.5s ease-out;
        }

        .progress-badge {
            position: absolute;
            right: -20px;
            top: -28px;
            background-color: var(--neon-pink-bright);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 6px;
            border-radius: 4px;
            white-space: nowrap;
            box-shadow: 0 0 10px var(--neon-pink-glow);
        }

        .progress-badge::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0 5px;
            border-style: solid;
            border-color: var(--neon-pink-bright) transparent transparent transparent;
        }

        /* --- ЦЕНТРАЛЬНЫЙ СЧЕТЧИК --- */
        .main-counter {
            padding: 28px 16px;
            text-align: center;
        }

        .counter-name {
            font-size: 16px;
            color: var(--neon-pink-light);
            margin-bottom: 6px;
            text-shadow: 0 0 6px var(--neon-pink-soft-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .counter-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--neon-pink-bright);
            text-shadow: 0 0 14px var(--neon-pink-glow);
        }

        /* --- ФОТОГРАФИЯ --- */
        .photo-section {
            width: 100%;
            overflow: hidden;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 0 18px var(--neon-pink-soft-glow);
            position: relative;
        }

        .couple-photo {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- СПИСОК СОБЫТИЙ --- */
        .event-list {
            padding: 0 16px;
            margin-top: 24px;
        }

        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-top: 1px solid var(--border-color);
        }

        .event-title, .event-sub-title {
            font-size: 16px;
            color: var(--neon-pink-light);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .event-details {
            text-align: right;
            color: var(--neon-pink-light);
        }

        .event-date {
            font-size: 12px;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .event-days {
            font-size: 13px;
            color: var(--neon-pink-bright);
            font-weight: 700;
            text-shadow: 0 0 6px var(--neon-pink-glow);
        }

        /* --- ПЛАВАЮЩАЯ КНОПКА ПОЦЕЛУЯ (FAB) --- */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #ff007f, #ff3399);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-pink-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 26px;
            border: none;
            cursor: pointer;
            z-index: 1000;
            animation: fabPulse 2s infinite ease-in-out;
        }

        @keyframes fabPulse {
            0%, 100% { box-shadow: 0 0 15px var(--neon-pink-glow); }
            50% { box-shadow: 0 0 28px var(--neon-pink-bright); }
        }

        .icon {
            font-style: normal;
        }
    </style>
</head>
<body>

    <!-- ФОНОВЫЕ ПЛАВАЮЩИЕ СЕРДЕЧКИ -->
    <div class="bg-hearts">
        <div class="bg-heart" style="left: 10%; animation-delay: 0s;">♥</div>
        <div class="bg-heart" style="left: 25%; animation-delay: 2s;">💖</div>
        <div class="bg-heart" style="left: 45%; animation-delay: 5s;">♥</div>
        <div class="bg-heart" style="left: 65%; animation-delay: 1s;">💕</div>
        <div class="bg-heart" style="left: 85%; animation-delay: 3.5s;">♥</div>
    </div>

    <div class="content">
        <!-- Блок профилей -->
        <div class="profiles-container">
            <div class="profile-item">
                <div class="avatar-wrapper">
                    <img src="https://i.postimg.cc/phMNvQZB/maryasha-avatar.png" alt="Марьяша" class="avatar">
                    <div class="avatar-kiss">💋</div>
                </div>
                <div class="profile-name">марьяша</div>
            </div>
            
            <div class="heart-counter">
                <div class="heart-icon">♥</div>
                <div class="heart-days" id="total-days-heart">--дней</div>
                <div class="center-kiss">💋💋💋</div>
            </div>

            <div class="profile-item">
                <div class="avatar-wrapper">
                    <img src="https://i.postimg.cc/CZWPDFnS/roma-avatar.png" alt="Рома" class="avatar">
                    <div class="avatar-kiss">💋</div>
                </div>
                <div class="profile-name">рома</div>
            </div>
        </div>

        <!-- Прогресс-бар -->
        <div class="progress-section">
            <div class="progress-labels">
                <div class="progress-label-left">💖 50дней</div>
                <div class="progress-label-right" id="days-to-goal">X--</div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill">
                    <div class="progress-badge" id="progress-percent">--%</div>
                </div>
            </div>
        </div>

        <!-- Большой счетчик -->
        <div class="main-counter">
            <div class="counter-name">✨ рома пёс ✨</div>
            <div class="counter-value" id="main-counter-value">--месяцев --дней</div>
        </div>

        <!-- Главное фото -->
        <div class="photo-section">
            <img src="https://i.postimg.cc/9rLj97mm/couple-photo.jpg" alt="пара" class="couple-photo">
        </div>

        <!-- Список событий -->
        <div class="event-list">
            <div class="event-item">
                <div class="event-title"><span>💋</span> Дата начала</div>
                <div class="event-details">
                    <div class="event-date">24.06.2026</div>
                    <div class="event-days" id="start-date-x">X+--</div>
                </div>
            </div>
            <div class="event-item">
                <div class="event-sub-title"><span>💖</span> 10дней</div>
                <div class="event-details">
                    <div class="event-date">04.07.2026</div>
                    <div class="event-days">X+36</div>
                </div>
            </div>
        </div>

        <!-- Плавающая кнопка-поцелуй -->
        <button class="fab" title="Поцелуй">
            <span class="icon">💋</span>
        </button>
    </div>

    <script>
        // === ПРИНУДИТЕЛЬНАЯ ОЧИСТКА ВНУТРЕННЕГО КЭША ===
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            });
        }

        // Дата начала: 24 июня 2026 года
        const startDate = new Date(2026, 5, 24);
        const targetGoalDays = 50;

        function updateCounters() {
            const now = new Date();

            const diffInMs = now - startDate;
            if (diffInMs < 0) return;
            
            const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));

            // Общее количество дней
            document.getElementById('total-days-heart').textContent = `${diffInDays}дней`;
            document.getElementById('start-date-x').textContent = `X+${diffInDays}`;

            // Месяцы и дни
            let yearsDiff = now.getFullYear() - startDate.getFullYear();
            let monthsDiff = now.getMonth() - startDate.getMonth();
            let daysDiff = now.getDate() - startDate.getDate();

            if (daysDiff < 0) {
                monthsDiff--;
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                daysDiff += prevMonth.getDate();
            }
            if (monthsDiff < 0) {
                yearsDiff--;
                monthsDiff += 12;
            }

            let mainCounterStr = "";
            if (yearsDiff > 0) mainCounterStr += `${yearsDiff}г `;
            if (monthsDiff > 0) mainCounterStr += `${monthsDiff}месяц `;
            mainCounterStr += `${daysDiff}дней`;
            document.getElementById('main-counter-value').textContent = mainCounterStr;

            // Прогресс-бар
            let progressDays = diffInDays >= targetGoalDays ? targetGoalDays : diffInDays;
            const percent = Math.floor((progressDays / targetGoalDays) * 100);
            
            document.getElementById('progress-fill').style.width = `${percent}%`;
            document.getElementById('progress-percent').textContent = `${percent}%`;

            const daysLeft = targetGoalDays - diffInDays;
            if (daysLeft > 0) {
                document.getElementById('days-to-goal').textContent = `X-${daysLeft}`;
            } else {
                document.getElementById('days-to-goal').textContent = `Достигнуто! 🎉`;
            }
        }

        updateCounters();
        setInterval(updateCounters, 60000);
    </script>
</body>
</html>
