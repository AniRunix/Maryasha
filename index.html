<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- ЗАПРЕТ КЭШИРОВАНИЯ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Love Chronicle Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

        :root {
            --bg-editorial: #0d0b0e;
            --cream-gold: #f3e5ab;
            --rose-muted: #d88398;
            --line-color: rgba(243, 229, 171, 0.2);
            --text-main: #fcf8f2;
            --text-sub: #a89f91;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-editorial);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            padding: 30px 18px 100px 18px;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #sparks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        .magazine-wrapper {
            max-width: 440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* --- ШАПКА ЖУРНАЛА --- */
        .editorial-header {
            text-align: center;
            border-bottom: 1px solid var(--line-color);
            padding-bottom: 16px;
        }

        .edition-tag {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--rose-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        /* РЕДАКТИРУЕМЫЙ СТАТУС В СТИЛЕ ЗАГОЛОВКА */
        .status-heading {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            letter-spacing: 2px;
            color: var(--cream-gold);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 10px;
            transition: opacity 0.2s;
        }

        .status-heading:hover { opacity: 0.8; }

        /* --- ГЛАВНЫЙ ВИЗУАЛЬНЫЙ БЛОК (ОБЛОЖКА) --- */
        .cover-frame {
            position: relative;
            padding: 10px;
            border: 1px solid var(--line-color);
        }

        .cover-photo-container {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4 / 5;
        }

        .cover-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.05) brightness(0.95);
            display: block;
        }

        /* Вшитые профили в стиле авторов */
        .authors-bar {
            position: absolute;
            bottom: 0;
            left: 0; right: 0;
            background: linear-gradient(to top, rgba(13, 11, 14, 0.95), transparent);
            padding: 20px 16px 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .author-person {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .author-person img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--cream-gold);
        }

        .author-name {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 1.5px;
            color: var(--text-main);
            text-transform: lowercase;
        }

        .author-divider {
            font-family: 'Cinzel', serif;
            color: var(--rose-muted);
            font-size: 16px;
        }

        /* --- ТИНКЕР / ШКАЛА ЦЕЛИ --- */
        .goal-filament-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filament-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .filament-line {
            height: 2px;
            background: rgba(243, 229, 171, 0.15);
            position: relative;
        }

        .filament-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--rose-muted), var(--cream-gold));
            transition: width 0.8s ease;
            position: relative;
        }

        .filament-progress::after {
            content: '';
            position: absolute;
            right: -4px;
            top: -3px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--cream-gold);
            box-shadow: 0 0 8px var(--cream-gold);
        }

        /* --- ЭЛЕГАНТНЫЙ ТАЙМЕР --- */
        .chronicle-counter {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            border-top: 1px solid var(--line-color);
            border-bottom: 1px solid var(--line-color);
            padding: 16px 0;
        }

        .counter-unit {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .unit-value {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            color: var(--cream-gold);
            font-weight: 600;
        }

        .unit-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        /* --- ПЕЧАТЬ ЛЮБВИ (ИНТЕРАКТИВНЫЙ ШТАМП) --- */
        .stamp-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .wax-seal {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 1px solid var(--cream-gold);
            background: radial-gradient(circle, #3d1520 0%, #17070c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(216, 131, 152, 0.2);
            transition: transform 0.2s;
        }

        .wax-seal:active { transform: scale(0.92); }

        .seal-symbol {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: var(--cream-gold);
        }

        .seal-caption {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        /* --- СПИСОК СОБЫТИЙ --- */
        .chronology-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chronology-title {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--cream-gold);
            text-transform: uppercase;
            text-align: center;
        }

        .chronology-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .chronology-list::-webkit-scrollbar { width: 2px; }
        .chronology-list::-webkit-scrollbar-thumb { background: var(--cream-gold); }

        .chronology-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(243, 229, 171, 0.12);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }

        .item-date {
            font-size: 10px;
            color: var(--text-sub);
        }

        .item-status {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            color: var(--rose-muted);
            letter-spacing: 1px;
        }

        /* ТОАСТ УВЕДОМЛЕНИЯ */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(40px);
            background: var(--cream-gold);
            color: var(--bg-editorial);
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 10px 20px;
            border-radius: 20px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast-notification.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <canvas id="sparks-canvas"></canvas>
    <div class="toast-notification" id="toast">Символ любви запечатан</div>

    <div class="magazine-wrapper">

        <!-- ШАПКА -->
        <div class="editorial-header">
            <div class="edition-tag">Love Chronicle — Vol. I</div>
            <div class="status-heading" onclick="editTitle()" title="Изменить статус">
                <span id="title-display">РОМА ПЁС</span>
                <span style="font-size: 11px; opacity: 0.5;">✎</span>
            </div>
        </div>

        <!-- ОБЛОЖКА C ФОТО И АВТОРАМИ -->
        <div class="cover-frame">
            <div class="cover-photo-container">
                <img src="https://i.postimg.cc/9rLj97mm/couple-photo.jpg" alt="Обложка">
                
                <div class="authors-bar">
                    <div class="author-person">
                        <img src="https://i.postimg.cc/phMNvQZB/maryasha-avatar.png" alt="Марьяша">
                        <span class="author-name">марьяша</span>
                    </div>

                    <div class="author-divider">✦</div>

                    <div class="author-person">
                        <img src="https://i.postimg.cc/CZWPDFnS/roma-avatar.png" alt="Рома">
                        <span class="author-name">рома</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- НИТЬ ПРОГРЕССА (ЦЕЛЬ 50 ДНЕЙ) -->
        <div class="goal-filament-section">
            <div class="filament-labels">
                <span>Цель: 50 Дней</span>
                <span id="goal-status-text">--</span>
            </div>
            <div class="filament-line">
                <div class="filament-progress" id="filament-bar"></div>
            </div>
        </div>

        <!-- СЧЕТЧИК ХРОНИКИ -->
        <div class="chronicle-counter">
            <div class="counter-unit">
                <span class="unit-value" id="year-num">0</span>
                <span class="unit-label">Лет</span>
            </div>
            <div class="counter-unit">
                <span class="unit-value" id="month-num">0</span>
                <span class="unit-label">Месяцев</span>
            </div>
            <div class="counter-unit">
                <span class="unit-value" id="day-num">0</span>
                <span class="unit-label">Дней</span>
            </div>
        </div>

        <!-- ШТАМП-ПЕЧАТЬ -->
        <div class="stamp-section">
            <div class="wax-seal" id="seal-btn">
                <span class="seal-symbol">♥</span>
            </div>
            <div class="seal-caption">Прикоснись к печати</div>
        </div>

        <!-- ХРОНОЛОГИЯ -->
        <div class="chronology-section">
            <div class="chronology-title">Календарные Вехи</div>
            <div class="chronology-list" id="events-timeline">
                <!-- Заполняется JS -->
            </div>
        </div>

    </div>

    <script>
        // СТАТУС
        function loadTitle() {
            const saved = localStorage.getItem('editorial_love_title');
            if (saved) document.getElementById('title-display').textContent = saved;
        }

        function editTitle() {
            const current = document.getElementById('title-display').textContent;
            const val = prompt("Введите новое имя / статус:", current);
            if (val && val.trim() !== "") {
                const text = val.trim();
                document.getElementById('title-display').textContent = text;
                localStorage.setItem('editorial_love_title', text);
            }
        }
        loadTitle();

        // РАСЧЕТ ДАТ
        const startDate = new Date(2026, 5, 24); // 24.06.2026
        const goalDaysTarget = 50;

        function calculateTime() {
            const now = new Date();
            const diffMs = now - startDate;
            if (diffMs < 0) return;

            const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            let y = now.getFullYear() - startDate.getFullYear();
            let m = now.getMonth() - startDate.getMonth();
            let d = now.getDate() - startDate.getDate();

            if (d < 0) {
                m--;
                const prevM = new Date(now.getFullYear(), now.getMonth(), 0);
                d += prevM.getDate();
            }
            if (m < 0) {
                y--;
                m += 12;
            }

            document.getElementById('year-num').textContent = y;
            document.getElementById('month-num').textContent = m;
            document.getElementById('day-num').textContent = d;

            // Шкала
            let prog = totalDays >= goalDaysTarget ? goalDaysTarget : totalDays;
            let percent = Math.floor((prog / goalDaysTarget) * 100);
            document.getElementById('filament-bar').style.width = percent + '%';

            let left = goalDaysTarget - totalDays;
            document.getElementById('goal-status-text').textContent = left > 0 ? `Осталось ${left}д` : `Достигнуто`;
        }

        // СОБЫТИЯ
        const eventsData = [
            { title: "Дата начала", date: "24.06.2026" },
            { title: "10 дней истории", date: "04.07.2026" },
            { title: "30 дней истории", date: "24.07.2026" },
            { title: "50 дней истории", date: "13.08.2026" },
            { title: "100 дней истории", date: "02.10.2026" },
            { title: "Новогодняя ночь", date: "31.12.2026" },
            { title: "Рождество", date: "07.01.2027" },
            { title: "200 дней", date: "10.01.2027" },
            { title: "День Святого Валентина", date: "14.02.2027" },
            { title: "1 Годовщина", date: "24.06.2027" },
            { title: "5 Лет Вместе", date: "24.06.2031" },
            { title: "10 Лет Вместе", date: "24.06.2036" }
        ];

        function renderChronology() {
            const list = document.getElementById('events-timeline');
            list.innerHTML = '';
            const now = new Date();

            eventsData.forEach(ev => {
                const parts = ev.date.split('.');
                const evDate = new Date(parts[2], parts[1] - 1, parts[0]);
                const diffDays = Math.ceil((evDate - now) / (1000 * 60 * 60 * 24));

                let status = diffDays > 0 ? `${diffDays} дн` : (diffDays === 0 ? `Сегодня` : `Пройдено`);

                const item = document.createElement('div');
                item.className = 'chronology-item';
                item.innerHTML = `
                    <div class="item-info">
                        <span class="item-title">${ev.title}</span>
                        <span class="item-date">${ev.date}</span>
                    </div>
                    <span class="item-status">${status}</span>
                `;
                list.appendChild(item);
            });
        }

        calculateTime();
        renderChronology();
        setInterval(calculateTime, 60000);

        // УВЕДОМЛЕНИЯ
        const messages = [
            "Любовь запечатлена ✦",
            "Поцелуй отправлен адресату 💋",
            "Бесконечность вместе ✨",
            "Момент сохранен в хронике 💖"
        ];

        function showToast() {
            const t = document.getElementById('toast');
            t.textContent = messages[Math.floor(Math.random() * messages.length)];
            t.classList.add('active');
            setTimeout(() => t.classList.remove('active'), 2200);
        }

        // АНИМАЦИЯ ЗОЛОТЫХ ИСКР
        const canvas = document.getElementById('sparks-canvas');
        const ctx = canvas.getContext('2d');
        let sparks = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Spark {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 3 + 1;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.color = ['#f3e5ab', '#d88398', '#ffffff'][Math.floor(Math.random() * 3)];
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.03;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createBurst(x, y) {
            for (let i = 0; i < 30; i++) sparks.push(new Spark(x, y));
        }

        function animateSparks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = sparks.length - 1; i >= 0; i--) {
                sparks[i].update();
                sparks[i].draw();
                if (sparks[i].life <= 0) sparks.splice(i, 1);
            }
            requestAnimationFrame(animateSparks);
        }
        animateSparks();

        document.getElementById('seal-btn').addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            createBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
            showToast();
        });

        window.addEventListener('pointerdown', (e) => {
            if (!e.target.closest('.status-heading') && !e.target.closest('.wax-seal')) {
                createBurst(e.clientX, e.clientY);
            }
        });
    </script>
</body>
</html>
