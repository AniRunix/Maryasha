<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- ЗАПРЕТ КЭШИРОВАНИЯ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Our Universe of Love</title>
    <style>
        :root {
            --bg-universe: radial-gradient(circle at 50% 30%, #2e0e29 0%, #120412 70%, #080109 100%);
            --glass-card: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 192, 203, 0.18);
            --accent-pink: #ff3366;
            --soft-gold: #fce38a;
            --rose-glow: #eaffd0;
            --text-light: #fff5f8;
            --text-dim: #c8a2c8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-universe);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px 16px 100px 16px;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ФОНОВЫЙ ЗВЕЗДОПАД И ЧАСТИЦЫ --- */
        #stars-canvas, #fireworks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        #stars-canvas { z-index: 0; }
        #fireworks-canvas { z-index: 99; }

        .app-wrapper {
            position: relative;
            z-index: 1;
            max-width: 440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- УНИКАЛЬНАЯ ЦЕНТРАЛЬНАЯ КАРТОЧКА С ФОТО И ШКАЛОЙ --- */
        .hero-section {
            position: relative;
            background: rgba(255, 240, 245, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Дуговая шкала прогресса над фото */
        .progress-header-custom {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--soft-gold);
            font-weight: 600;
            margin-bottom: 12px;
            padding: 0 10px;
        }

        .arc-bar-container {
            position: relative;
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .arc-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff3366, #fce38a);
            border-radius: 10px;
            box-shadow: 0 0 12px #ff3366;
            transition: width 1s ease-in-out;
        }

        /* Блок с фото и вшитыми аватарами */
        .photo-stage {
            position: relative;
            margin: 0 auto;
            border-radius: 28px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(255, 51, 102, 0.2);
        }

        .main-photo {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        /* Перекрывающие аватары поверх фото */
        .profiles-overlay {
            position: absolute;
            bottom: 12px;
            left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
        }

        .mini-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(18, 4, 18, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 12px 6px 6px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .mini-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--soft-gold);
        }

        .mini-name {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            text-transform: capitalize;
        }

        /* --- ТИТУЛ И СТА ТУС --- */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            background: rgba(255, 51, 102, 0.15);
            border: 1px dashed var(--accent-pink);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .status-badge:active { transform: scale(0.96); }

        .status-text {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--soft-gold);
        }

        /* --- СЧЕТЧИК КАПСУЛЫ --- */
        .time-capsules {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
        }

        .capsule-item {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            padding: 10px 14px;
            border-radius: 18px;
            min-width: 80px;
        }

        .capsule-num {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
        }

        .capsule-lbl {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* --- ИНТЕРАКТИВНЫЙ ТАЛИСМАН (ВМЕСТО КНОПКИ) --- */
        .love-talisman-wrap {
            text-align: center;
            margin: 5px 0;
        }

        .love-talisman {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff3366, #7928ca);
            border-radius: 50%;
            font-size: 30px;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.6);
            cursor: pointer;
            border: 3px solid rgba(255,255,255,0.3);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 51, 102, 0.5); }
            100% { transform: scale(1.08); box-shadow: 0 0 40px rgba(255, 51, 102, 0.9); }
        }

        .talisman-hint {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* --- ВСПЫХИВАЮЩЕЕ СООБЩЕНИЕ --- */
        .toast-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-50px);
            background: rgba(255, 51, 102, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            pointer-events: none;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* --- СПИСОК СОБЫТИЙ С НОВОЙ СТИЛИСТИКОЙ --- */
        .events-block {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 20px;
        }

        .events-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--soft-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .events-timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .events-timeline::-webkit-scrollbar { width: 4px; }
        .events-timeline::-webkit-scrollbar-thumb {
            background: rgba(255, 51, 102, 0.5);
            border-radius: 10px;
        }

        .timeline-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .timeline-card.special {
            background: linear-gradient(90deg, rgba(255, 51, 102, 0.15), rgba(121, 40, 202, 0.15));
            border-color: rgba(255, 51, 102, 0.3);
        }

        .timeline-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timeline-icon {
            font-size: 18px;
        }

        .timeline-name {
            font-size: 13px;
            font-weight: 600;
        }

        .timeline-date-sub {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .timeline-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: var(--soft-gold);
        }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>
    <canvas id="fireworks-canvas"></canvas>

    <div class="toast-msg" id="toast">Поцелуй отправлен! 💖</div>

    <div class="app-wrapper">

        <!-- ЦЕНТРАЛЬНАЯ КАРТОЧКА С ФОТО И ПРОГРЕССОМ -->
        <div class="hero-section">
            
            <!-- Шкала прогресса цели -->
            <div class="progress-header-custom">
                <span>Цель: 50 дней</span>
                <span id="goal-days-left">--</span>
            </div>
            <div class="arc-bar-container">
                <div class="arc-bar-fill" id="goal-bar-fill"></div>
            </div>

            <!-- Главное фото с встроенными аватарками парней/девушек -->
            <div class="photo-stage">
                <img src="https://i.postimg.cc/9rLj97mm/couple-photo.jpg" alt="Наше Фото" class="main-photo">
                
                <div class="profiles-overlay">
                    <div class="mini-profile">
                        <img src="https://i.postimg.cc/phMNvQZB/maryasha-avatar.png" alt="Марьяша" class="mini-avatar">
                        <span class="mini-name">марьяша</span>
                    </div>

                    <div class="mini-profile">
                        <img src="https://i.postimg.cc/CZWPDFnS/roma-avatar.png" alt="Рома" class="mini-avatar">
                        <span class="mini-name">рома</span>
                    </div>
                </div>
            </div>

            <!-- Редактируемый статус -->
            <div class="status-badge" onclick="changeStatus()" title="Нажмите, чтобы изменить статус">
                <span style="font-size: 12px;">✨</span>
                <span class="status-text" id="status-display">РОМА ПЁС</span>
                <span style="font-size: 10px; opacity: 0.6;">✏️</span>
            </div>

            <!-- Раздельный таймер (Капсулы времени) -->
            <div class="time-capsules">
                <div class="capsule-item">
                    <div class="capsule-num" id="capsule-years">0</div>
                    <div class="capsule-lbl">лет</div>
                </div>
                <div class="capsule-item">
                    <div class="capsule-num" id="capsule-months">0</div>
                    <div class="capsule-lbl">месяцев</div>
                </div>
                <div class="capsule-item">
                    <div class="capsule-num" id="capsule-days">0</div>
                    <div class="capsule-lbl">дней</div>
                </div>
            </div>

        </div>

        <!-- ИНТЕРАКТИВНЫЙ ТАЛИСМАН ВМЕСТО КНОПКИ -->
        <div class="love-talisman-wrap">
            <div class="love-talisman" id="talisman-btn">💖</div>
            <div class="talisman-hint">Прикоснись к талисману любви</div>
        </div>

        <!-- СПИСОК СОБЫТИЙ -->
        <div class="events-block">
            <div class="events-title">
                <span>🗓️</span> Календарь истории
            </div>
            <div class="events-timeline" id="events-list">
                <!-- Заполняется динамически -->
            </div>
        </div>

    </div>

    <script>
        // --- 1. РЕДАКТИРОВАНИЕ СТАТУСА ---
        function loadStatus() {
            const saved = localStorage.getItem('unique_love_status');
            if (saved) document.getElementById('status-display').textContent = saved;
        }

        function changeStatus() {
            const current = document.getElementById('status-display').textContent;
            const next = prompt("Введите новое имя или статус:", current);
            if (next && next.trim() !== "") {
                const val = next.trim();
                document.getElementById('status-display').textContent = val;
                localStorage.setItem('unique_love_status', val);
            }
        }
        loadStatus();

        // --- 2. РАСЧЕТ ВРЕМЕНИ И ЦЕЛЕЙ ---
        const startDate = new Date(2026, 5, 24); // 24.06.2026
        const goalDaysTarget = 50;

        function updateTime() {
            const now = new Date();
            const diffMs = now - startDate;
            if (diffMs < 0) return;

            const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            let y = now.getFullYear() - startDate.getFullYear();
            let m = now.getMonth() - startDate.getMonth();
            let d = now.getDate() - startDate.getDate();

            if (d < 0) {
                m--;
                const prevM = new Date(now.getFullYear(), now.getMonth(), 0);
                d += prevM.getDate();
            }
            if (m < 0) {
                y--;
                m += 12;
            }

            document.getElementById('capsule-years').textContent = y;
            document.getElementById('capsule-months').textContent = m;
            document.getElementById('capsule-days').textContent = d;

            // Шкала прогресса
            let prog = totalDays >= goalDaysTarget ? goalDaysTarget : totalDays;
            let percent = Math.floor((prog / goalDaysTarget) * 100);
            document.getElementById('goal-bar-fill').style.width = percent + '%';

            let left = goalDaysTarget - totalDays;
            document.getElementById('goal-days-left').textContent = left > 0 ? `Осталось: ${left}д` : `Достигнуто! 💕`;
        }

        // --- 3. КАЛЕНДАРЬ СОБЫТИЙ ---
        const eventsData = [
            { title: "Дата начала", date: "24.06.2026", icon: "💋" },
            { title: "10 дней", date: "04.07.2026", icon: "💖" },
            { title: "30 дней", date: "24.07.2026", icon: "💖" },
            { title: "50 дней", date: "13.08.2026", icon: "💖" },
            { title: "100 дней", date: "02.10.2026", icon: "💖" },
            { title: "Новогодняя ночь", date: "31.12.2026", icon: "🎄", isHoliday: true },
            { title: "Рождество", date: "07.01.2027", icon: "🏠", isHoliday: true },
            { title: "200 дней", date: "10.01.2027", icon: "💖" },
            { title: "День Валентина", date: "14.02.2027", icon: "🛍️", isHoliday: true },
            { title: "Мужской день", date: "23.02.2027", icon: "⭐", isHoliday: true },
            { title: "Женский день", date: "08.03.2027", icon: "💐", isHoliday: true },
            { title: "1 год", date: "24.06.2027", icon: "🎉", isHoliday: true },
            { title: "5 лет", date: "24.06.2031", icon: "👑", isHoliday: true },
            { title: "10 лет", date: "24.06.2036", icon: "💎", isHoliday: true }
        ];

        function renderEvents() {
            const list = document.getElementById('events-list');
            list.innerHTML = '';
            const now = new Date();

            eventsData.forEach(ev => {
                const parts = ev.date.split('.');
                const evDate = new Date(parts[2], parts[1] - 1, parts[0]);
                const diffDays = Math.ceil((evDate - now) / (1000 * 60 * 60 * 24));

                let badgeText = diffDays > 0 ? `Через ${diffDays} дн` : (diffDays === 0 ? `Сегодня!` : `Пройдено`);

                const card = document.createElement('div');
                card.className = `timeline-card ${ev.isHoliday ? 'special' : ''}`;
                card.innerHTML = `
                    <div class="timeline-info">
                        <div class="timeline-icon">${ev.icon}</div>
                        <div>
                            <div class="timeline-name">${ev.title}</div>
                            <div class="timeline-date-sub">${ev.date}</div>
                        </div>
                    </div>
                    <div class="timeline-badge">${badgeText}</div>
                `;
                list.appendChild(card);
            });
        }

        updateTime();
        renderEvents();
        setInterval(updateTime, 60000);

        // --- 4. ВСПОМОГАТЕЛЬНЫЕ ЭФФЕКТЫ И ВСПЛЫВАЮЩИЕ ФРАЗЫ ---
        const romanticQuotes = [
            "Ты — лучшее, что случилось со мной! 💖",
            "Моё сердце бьётся ради тебя! 💓",
            "Отправлен крепкий поцелуй! 💋",
            "Люблю тебя с каждым днём всё сильнее! ✨",
            "Ты моё счастье! 🌸"
        ];

        function showToast() {
            const toast = document.getElementById('toast');
            const randomQuote = romanticQuotes[Math.floor(Math.random() * romanticQuotes.length)];
            toast.textContent = randomQuote;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // --- 5. АНИМАЦИЯ ЗВЕЗДНОГО ФОНА И САЛЮТОВ ---
        const starsCanvas = document.getElementById('stars-canvas');
        const starsCtx = starsCanvas.getContext('2d');
        const fwCanvas = document.getElementById('fireworks-canvas');
        const fwCtx = fwCanvas.getContext('2d');

        let stars = [];
        let particles = [];

        function resizeCanvases() {
            starsCanvas.width = fwCanvas.width = window.innerWidth;
            starsCanvas.height = fwCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        // Создаем звездное небо
        for(let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2,
                alpha: Math.random()
            });
        }

        function drawStars() {
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            starsCtx.fillStyle = "#ffffff";
            stars.forEach(s => {
                s.alpha += (Math.random() - 0.5) * 0.02;
                if(s.alpha < 0.1) s.alpha = 0.1;
                if(s.alpha > 0.9) s.alpha = 0.9;
                starsCtx.globalAlpha = s.alpha;
                starsCtx.beginPath();
                starsCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                starsCtx.fill();
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // Частицы салютов
        class Spark {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 5 + 2;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.color = ['#ff3366', '#fce38a', '#ffffff', '#eaffd0'][Math.floor(Math.random() * 4)];
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.08;
                this.life -= this.decay;
            }
            draw() {
                fwCtx.save();
                fwCtx.globalAlpha = this.life;
                fwCtx.fillStyle = this.color;
                fwCtx.beginPath();
                fwCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                fwCtx.fill();
                fwCtx.restore();
            }
        }

        function triggerLoveBurst(x, y) {
            for(let i = 0; i < 40; i++) particles.push(new Spark(x, y));
        }

        function animateSparks() {
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            for(let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if(particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateSparks);
        }
        animateSparks();

        // Клик по талисману
        document.getElementById('talisman-btn').addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            triggerLoveBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
            showToast();
        });

        // Клик в любом месте
        window.addEventListener('pointerdown', (e) => {
            if(e.target.tagName !== 'BUTTON' && !e.target.classList.contains('status-badge')) {
                triggerLoveBurst(e.clientX, e.clientY);
            }
        });
    </script>
</body>
</html>
