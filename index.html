<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- ЗАПРЕТ КЭШИРОВАНИЯ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Наша Нежная История 💕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap');

        :root {
            --bg-soft: #fff0f5;
            --card-bg: rgba(255, 255, 255, 0.75);
            --pink-main: #ff758c;
            --pink-accent: #ff7eb3;
            --text-dark: #6c4f5a;
            --text-muted: #a07a8b;
            --shadow-soft: 0 10px 30px rgba(255, 117, 140, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffe6e8 0%, #fff0f3 50%, #f3e8ff 100%);
            color: var(--text-dark);
            font-family: 'Comfortaa', cursive, sans-serif;
            min-height: 100vh;
            padding: 20px 16px 80px 16px;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ПАРЯЩИЕ СЕРДЕЧКИ НА ФОНЕ --- */
        .bg-hearts {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-heart {
            position: absolute;
            color: rgba(255, 117, 140, 0.25);
            font-size: 20px;
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.8) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        #hearts-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- СТАТУС --- */
        .title-badge {
            text-align: center;
            margin-top: 10px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid #ffffff;
            border-radius: 30px;
            color: var(--pink-main);
            font-weight: 700;
            font-size: 15px;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .status-pill:active {
            transform: scale(0.96);
        }

        /* --- ПРЯМОУГОЛЬНАЯ РАМКА ДЛЯ ФОТО --- */
        .photo-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 3px solid #ffffff;
            border-radius: 28px;
            padding: 16px;
            box-shadow: var(--shadow-soft);
        }

        .photo-rectangular {
            width: 100%;
            height: 320px;
            border-radius: 18px;
            object-fit: cover;
            display: block;
            box-shadow: 0 8px 20px rgba(108, 79, 90, 0.1);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .profiles-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 16px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
        }

        .profile-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-item img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--pink-main);
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.2);
            image-rendering: -webkit-optimize-contrast;
        }

        .profile-item span {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Сердечко между профилями */
        .heart-beat {
            font-size: 22px;
            color: var(--pink-main);
            cursor: pointer;
            animation: heartPulse 1.2s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        .heart-beat:hover {
            transform: scale(1.4);
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* --- ПРОГРЕСС ЦЕЛИ --- */
        .goal-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 22px;
            padding: 16px 20px;
            box-shadow: var(--shadow-soft);
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .goal-track {
            height: 14px;
            background: #ffe3e8;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            padding: 2px;
        }

        .goal-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--pink-accent), var(--pink-main));
            border-radius: 20px;
            transition: width 0.8s ease;
        }

        /* --- ГЛАВНЫЙ СЧЁТЧИК ДНЕЙ --- */
        .total-days-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 22px;
            padding: 16px;
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .total-days-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .total-days-count {
            font-size: 32px;
            font-weight: 700;
            color: var(--pink-main);
            line-height: 1.2;
        }

        .total-days-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 600;
        }

        /* --- ТАЙМЕР-ОБЛАЧКА (ЛЕТ / МЕСЯЦЕВ / ДНЕЙ) --- */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .timer-cloud {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 22px;
            padding: 14px 8px;
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .timer-num {
            font-size: 24px;
            font-weight: 700;
            color: var(--pink-main);
        }

        .timer-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 600;
        }

        /* --- КНОПКА ГАЛЕРЕИ ВОСПОМИНАНИЙ --- */
        .gallery-btn {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--pink-main);
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .gallery-btn:active {
            transform: scale(0.96);
            background: #ffffff;
        }

        /* --- БОЛЬШАЯ КНОПКА-СЕРДЦЕ И ОКОШКО ФРАЗЫ --- */
        .heart-button-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
        }

        .big-heart-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff7eb3 0%, #ff758c 100%);
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .big-heart-btn:active {
            transform: scale(0.88);
        }

        .love-quote-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 20px;
            padding: 12px 18px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            box-shadow: var(--shadow-soft);
            width: 100%;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* --- СПИСОК СОБЫТИЙ --- */
        .events-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 28px;
            padding: 20px;
            box-shadow: var(--shadow-soft);
        }

        .events-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--pink-main);
            text-align: center;
            margin-bottom: 14px;
        }

        .events-scroll {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .events-scroll::-webkit-scrollbar { width: 4px; }
        .events-scroll::-webkit-scrollbar-thumb {
            background: var(--pink-accent);
            border-radius: 10px;
        }

        .event-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            border: 1px solid #ffeef1;
        }

        .event-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .event-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .event-date {
            font-size: 10px;
            color: var(--text-muted);
        }

        .event-badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--pink-main);
            background: #ffe6eb;
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* --- МОДАЛЬНЫЕ ОКНА --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(108, 79, 90, 0.4);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #fff5f7;
            border: 3px solid #ffffff;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid #ffe3e8;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--pink-main);
        }

        .close-btn {
            background: #ffe6eb;
            border: none;
            color: var(--pink-main);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .gallery-grid {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .memory-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.1);
            border: 1px solid #ffeef1;
        }

        .memory-img {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            border-radius: 14px;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .memory-desc {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            text-align: center;
        }

        /* Окно для фотографии по сердечку */
        .photo-modal-body {
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .popup-img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(108, 79, 90, 0.15);
        }

        /* ВСПЛЫВАЮЩИЙ ТОАСТ */
        .toast-bubble {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-70px);
            background: #ffffff;
            color: var(--pink-main);
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(255, 117, 140, 0.3);
            border: 2px solid var(--pink-accent);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast-bubble.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- ПАРЯЩИЕ ФОНОВЫЕ СЕРДЕЧКИ -->
    <div class="bg-hearts" id="bg-hearts"></div>

    <canvas id="hearts-canvas"></canvas>
    <div class="toast-bubble" id="toast-pop">Нажми на сердечко! 💕</div>

    <div class="wrapper">

        <!-- СТАТУС -->
        <div class="title-badge">
            <div class="status-pill" onclick="editStatus()" title="Нажмите, чтобы изменить">
                <span>🎀</span>
                <span id="status-text">РОМА ПЁС</span>
                <span style="font-size: 10px; opacity: 0.6;">✏️</span>
            </div>
        </div>

        <!-- КАРТОЧКА С ГЛАВНЫМ ПРЯМОУГОЛЬНЫМ ФОТО -->
        <div class="photo-card">
            <img class="photo-rectangular" src="https://i.postimg.cc/9rLj97mm/image.jpeg" alt="Наше Фото">

            <div class="profiles-row">
                <div class="profile-item">
                    <img src="https://i.postimg.cc/phMNvQZB/maryasha-avatar.png" alt="Марьяша">
                    <span>марьяша</span>
                </div>

                <!-- КЛИКАБЕЛЬНОЕ СЕРДЕЧКО МЕЖДУ ФОТОГРАФИЯМИ -->
                <div class="heart-beat" id="heart-photo-btn" title="Нажми на сердечко!">💖</div>

                <div class="profile-item">
                    <img src="https://i.postimg.cc/CZWPDFnS/roma-avatar.png" alt="Рома">
                    <span>рома</span>
                </div>
            </div>
        </div>

        <!-- ПРОГРЕСС ЦЕЛИ (50 ДНЕЙ) -->
        <div class="goal-box">
            <div class="goal-header">
                <span>Цель: 50 дней любви</span>
                <span id="goal-counter">--</span>
            </div>
            <div class="goal-track">
                <div class="goal-fill" id="goal-fill-bar"></div>
            </div>
        </div>

        <!-- КАРТОЧКА: ОБЩИЙ СЧЁТЧИК ДНЕЙ -->
        <div class="total-days-card">
            <div class="total-days-title">МЫ ВМЕСТЕ УЖЕ</div>
            <div class="total-days-count" id="total-days-val">0</div>
            <div class="total-days-sub" id="total-days-text">дней</div>
        </div>

        <!-- ТАЙМЕР-ОБЛАЧКА (ЛЕТ / МЕСЯЦЕВ / ДНЕЙ) -->
        <div class="timer-grid">
            <div class="timer-cloud">
                <div class="timer-num" id="years-val">0</div>
                <div class="timer-text">лет</div>
            </div>
            <div class="timer-cloud">
                <div class="timer-num" id="months-val">0</div>
                <div class="timer-text">месяцев</div>
            </div>
            <div class="timer-cloud">
                <div class="timer-num" id="days-val">0</div>
                <div class="timer-text">дней</div>
            </div>
        </div>

        <!-- КНОПКА ГАЛЕРЕИ ВОСПОМИНАНИЙ -->
        <div class="gallery-btn" id="open-gallery-btn">
            <span>📸</span> Галерея наших воспоминаний <span>💕</span>
        </div>

        <!-- КНОПКА-СЕРДЦЕ + КАРТОЧКА ФРАЗЫ -->
        <div class="heart-button-wrapper">
            <div class="big-heart-btn" id="kiss-btn">💖</div>
            <div class="love-quote-card" id="quote-display">
                Коснись сердечка, чтобы получить послание... ✨
            </div>
        </div>

        <!-- СПИСОК СОБЫТИЙ -->
        <div class="events-card">
            <div class="events-title">🌸 Наш Календарь Счастья</div>
            <div class="events-scroll" id="events-container">
                <!-- Динамически заполняется -->
            </div>
        </div>

    </div>

    <!-- МОДАЛЬНОЕ ОКНО ФОТОГРАФИИ ПО СЕРДЕЧКУ -->
    <div class="modal-overlay" id="photo-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">💖 Наше Особое Фото</div>
                <button class="close-btn" id="close-photo-btn">✕</button>
            </div>
            <div class="photo-modal-body">
                <img class="popup-img" src="https://i.postimg.cc/w1Rpb1Wk/image.jpg" alt="Особое фото">
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ГАЛЕРЕИ ВОСПОМИНАНИЙ -->
    <div class="modal-overlay" id="gallery-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🖼️ Альбом воспоминаний</div>
                <button class="close-btn" id="close-gallery-btn">✕</button>
            </div>
            <div class="gallery-grid" id="gallery-container">
                <!-- Заполняется из JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // СПИСОК ВОСПОМИНАНИЙ В ПОЛНОМ РАЗРЕШЕНИИ
        const memoriesData = [
            {
                img: "https://i.postimg.cc/SXYXyQDP/image.jpeg",
                desc: "Наш первый день🤭"
            },
            {
                img: "https://i.postimg.cc/XXkgMxZx/image.jpeg",
                desc: "Тут нам неделя😚"
            },
            {
                img: "https://i.postimg.cc/47Tpqhsj/image.jpeg",
                desc: "А тут нам уже 3 недели (фоток со второй нету((( )😌"
            },
            {
                img: "https://i.postimg.cc/hzrQYyCS/image.jpeg",
                desc: "Тут нам уже ровно месяц 😍😍"
            },
            {
                img: "https://i.postimg.cc/nsfshbgc/image.jpeg",
                desc: "Это поездка к родителям Алисы😛"
            },
            {
                img: "https://i.postimg.cc/ZWpRgsRM/image.jpeg",
                desc: "А тут мы с тобой делали ручки🫶🫶"
            },
            {
                img: "https://i.postimg.cc/Q94x5R4m/image.jpeg",
                desc: "Первая ночевка у тебя дома🏠"
            },
            {
                img: "https://i.postimg.cc/pmbVDQZj/image.jpeg",
                desc: "Это ты меня накрасила💅"
            },
            {
                img: "https://i.postimg.cc/jDHxvW3C/image.jpeg",
                desc: "Это мы водили никиту в движение первых🐒🐒"
            },
            {
                img: "https://i.postimg.cc/VrVm5Xv9/image.jpeg",
                desc: "А это уже наш первый раз🤪🤪🔞"
            },
            {
                img: "https://i.postimg.cc/pymP4c1t/image.jpeg",
                desc: "Ну а это концерт газана 6️⃣7️⃣"
            }
        ];

        // РЕНДЕР ГАЛЕРЕИ
        function renderGallery() {
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';
            memoriesData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.innerHTML = `
                    <img class="memory-img" src="${item.img}" alt="${item.desc}" loading="lazy">
                    <div class="memory-desc">${item.desc}</div>
                `;
                container.appendChild(card);
            });
        }
        renderGallery();

        // УПРАВЛЕНИЕ МОДАЛЬНЫМИ ОКНАМИ И БЛОКИРОВКА СКРОЛЛА
        function openModal(modalElement) {
            modalElement.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(modalElement) {
            modalElement.classList.remove('active');
            document.body.style.overflow = '';
        }

        // 1. Окно фотографии по сердечку

        function getDaysWord(num) {
            let n = Math.abs(num) % 100;
            let n1 = n % 10;
            if (n > 10 && n < 20) return 'дней';
            if (n1 > 1 && n1 < 5) return 'дня';
            if (n1 === 1) return 'день';
            return 'дней';
        }

        // РАСЧЕТ ВРЕМЕНИ И ЦЕЛИ
        const startDate = new Date(2026, 5, 24); // 24.06.2026
        const goalTarget = 50;

        function updateTimer() {
            const now = new Date();
            const diffMs = now - startDate;
            if (diffMs < 0) return;

            const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            // Обновляем главный счётчик дней
            document.getElementById('total-days-val').textContent = totalDays;
            document.getElementById('total-days-text').textContent = getDaysWord(totalDays);

            let y = now.getFullYear() - startDate.getFullYear();
            let m = now.getMonth() - startDate.getMonth();
            let d = now.getDate() - startDate.getDate();

            if (d < 0) {
                m--;
                const prevM = new Date(now.getFullYear(), now.getMonth(), 0);
                d += prevM.getDate();
            }
            if (m < 0) {
                y--;
                m += 12;
            }

            document.getElementById('years-val').textContent = y;
            document.getElementById('months-val').textContent = m;
            document.getElementById('days-val').textContent = d;

            let currentProg = totalDays >= goalTarget ? goalTarget : totalDays;
            let pct = Math.floor((currentProg / goalTarget) * 100);
            document.getElementById('goal-fill-bar').style.width = pct + '%';

            let leftDays = goalTarget - totalDays;
            document.getElementById('goal-counter').textContent = leftDays > 0 ? `Осталось: ${leftDays}д` : `Цель достигнута! 💕`;
        }

        // АНИМАЦИЯ СЕРДЕЧЕК В БРАУЗЕРЕ
        const canvas = document.getElementById('hearts-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class HeartParticle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 16 + 10;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6 - 2;
                this.color = ['#ff758c', '#ff7eb3', '#ffaaa5', '#ffd3b6'][Math.floor(Math.random() * 4)];
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.font = `${this.size}px serif`;
                ctx.fillText('♥', this.x, this.y);
                ctx.restore();
            }
        }

        function burstHearts(x, y) {
            for (let i = 0; i < 25; i++) particles.push(new HeartParticle(x, y));
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(renderParticles);
        }
        renderParticles();
