    <style>
        :root {
            --bg-grad-1: #07030a;
            --bg-grad-2: #160318;
            --glass-bg: rgba(255, 0, 127, 0.05);
            --glass-card: rgba(26, 10, 24, 0.55);
            --glass-border: rgba(255, 0, 127, 0.25);
            --neon-pink: #ff007f;
            --neon-glow: #ff007faa;
            --neon-accent: #ff66cc;
            --text-main: #fbeaff;
            --text-sub: #b388bf;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-main);
            padding-top: 24px;
            padding-bottom: 100px;
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* --- ЧАСТИЦЫ ФОНА --- */
        .bg-elements {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-item {
            position: absolute;
            color: var(--neon-accent);
            opacity: 0.25;
            font-size: 16px;
            animation: floatUp 10s infinite ease-in-out;
            filter: drop-shadow(0 0 8px var(--neon-pink));
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg) scale(0.8); opacity: 0; }
            30% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* --- ПРОФИЛИ С ЭФФЕКТОМ СТЕКЛА --- */
        .glass-panel {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 15px var(--glass-bg);
            margin-bottom: 20px;
            padding: 20px;
        }

        .profiles-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .profile-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
            padding: 4px;
            background: linear-gradient(45deg, var(--neon-pink), transparent, var(--neon-accent));
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-glow);
        }

        .avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .avatar-kiss {
            position: absolute;
            bottom: -4px;
            right: -4px;
            font-size: 20px;
            background: rgba(10, 5, 8, 0.8);
            border-radius: 50%;
            padding: 2px;
            animation: pulseKiss 2s infinite ease-in-out;
        }

        @keyframes pulseKiss {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .profile-name {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
            text-transform: lowercase;
        }

        .heart-counter {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .heart-icon {
            font-size: 32px;
            color: var(--neon-pink);
            filter: drop-shadow(0 0 10px var(--neon-pink));
            animation: heartBeat 1.4s infinite ease-in-out;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
        }

        .heart-days {
            font-size: 15px;
            font-weight: 800;
            color: var(--neon-accent);
            text-shadow: 0 0 8px var(--neon-glow);
        }

        /* --- КАПСУЛА ПРОГРЕССА --- */
        .progress-section {
            margin-bottom: 20px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .progress-bar-container {
            height: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            padding: 2px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff007f, #ff66cc);
            border-radius: 20px;
            box-shadow: 0 0 12px var(--neon-pink);
            transition: width 0.6s ease-out;
            position: relative;
        }

        .progress-badge {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 4px #000;
        }

        /* --- ГЛАВНЫЙ ТАЙМЕР --- */
        .main-counter {
            text-align: center;
            padding: 16px;
        }

        .counter-name {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .counter-value {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 12px var(--neon-pink);
        }

        /* --- ФОТО РАМКА --- */
        .photo-card {
            padding: 8px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 28px;
        }

        .couple-photo {
            width: 100%;
            border-radius: 18px;
            display: block;
        }

        /* --- УНИКАЛЬНЫЙ ВЕРТИКАЛЬНЫЙ ТАЙМЛАЙН --- */
        .timeline-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 16px;
            color: var(--neon-accent);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timeline {
            position: relative;
            padding-left: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 5px;
            bottom: 5px;
            width: 2px;
            background: linear-gradient(180deg, var(--neon-pink), rgba(255, 0, 127, 0.1));
            box-shadow: 0 0 8px var(--neon-pink);
        }

        .event-item {
            position: relative;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: var(--glass-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .event-item::before {
            content: '';
            position: absolute;
            left: -18px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--bg-grad-1);
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 8px var(--neon-pink);
        }

        /* Выделение праздников */
        .event-item.holiday {
            border: 1px solid var(--glass-border);
            background: rgba(255, 0, 127, 0.12);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.15);
        }

        .event-item.holiday::before {
            background: var(--neon-pink);
            box-shadow: 0 0 12px var(--neon-pink);
        }

        .event-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .event-details {
            text-align: right;
        }

        .event-date {
            font-size: 11px;
            color: var(--text-sub);
        }

        .event-days {
            font-size: 13px;
            font-weight: 700;
            color: var(--neon-accent);
            text-shadow: 0 0 6px var(--neon-glow);
        }

        /* --- КНОПКА ФЛОАТИРОВАНИЯ --- */
        .fab {

            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff007f, #ff66cc);

            color: #ffffff;
            font-size: 26px;
            border: none;
            cursor: pointer;
            z-index: 1000;
            animation: fabPulse 2s infinite ease-in-out;
        }

        @keyframes fabPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px var(--neon-pink); }
            50% { transform: scale(1.08); box-shadow: 0 0 25px var(--neon-accent); }
        }
    </style>
</head>

        function parseDate(dateStr) {
            const parts = dateStr.split('.');
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            const now = new Date();

            eventsData.forEach(item => {
                const itemDate = parseDate(item.date);
                const diffTime = itemDate - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let daysLabel = "";
                if (diffDays > 0) {
                    daysLabel = `X-${diffDays}`;
                } else if (diffDays === 0) {
                    daysLabel = `Сегодня! 🎉`;
                } else {
                    daysLabel = `X+${Math.abs(diffDays)}`;
                }

                const eventEl = document.createElement('div');
                eventEl.className = `event-item ${item.isHoliday ? 'holiday' : ''}`;
                eventEl.innerHTML = `
                    <div class="event-title">
                        <span>${item.icon}</span> ${item.title}
                    </div>
                    <div class="event-details">
                        <div class="event-date">${item.date}</div>
                        <div class="event-days">${daysLabel}</div>
                    </div>
                `;
                container.appendChild(eventEl);
            });
        }

        function updateCounters() {
            const now = new Date();
            const diffInMs = now - startDate;
            if (diffInMs < 0) return;
            
            const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));

            document.getElementById('total-days-heart').textContent = `${diffInDays}дней`;

            let yearsDiff = now.getFullYear() - startDate.getFullYear();
            let monthsDiff = now.getMonth() - startDate.getMonth();
            let daysDiff = now.getDate() - startDate.getDate();

            if (daysDiff < 0) {
                monthsDiff--;
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                daysDiff += prevMonth.getDate();
            }
            if (monthsDiff < 0) {
                yearsDiff--;
                monthsDiff += 12;
            }

            let mainCounterStr = "";
            if (yearsDiff > 0) mainCounterStr += `${yearsDiff}г `;
            if (monthsDiff > 0) mainCounterStr += `${monthsDiff}месяц `;
            mainCounterStr += `${daysDiff}дней`;
            document.getElementById('main-counter-value').textContent = mainCounterStr;

            let progressDays = diffInDays >= targetGoalDays ? targetGoalDays : diffInDays;
            const percent = Math.floor((progressDays / targetGoalDays) * 100);
            
            document.getElementById('progress-fill').style.width = `${percent}%`;
            document.getElementById('progress-percent').textContent = `${percent}%`;

            const daysLeft = targetGoalDays - diffInDays;
            if (daysLeft > 0) {
                document.getElementById('days-to-goal').textContent = `X-${daysLeft}`;
            } else {
                document.getElementById('days-to-goal').textContent = `Достигнуто! 🎉`;
            }
        }

        renderEvents();
        updateCounters();
        setInterval(updateCounters, 60000);

        // --- ИНТЕРАКТИВНЫЙ САЛЮТ ---
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.color = ['#ff007f', '#ff66cc', '#ffffff', '#ffb3d9'][Math.floor(Math.random() * 4)];
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.symbol = Math.random() > 0.6 ? (Math.random() > 0.5 ? '✨' : '💖') : null;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.08;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                if (this.symbol) {
                    ctx.font = `${this.size * 3}px sans-serif`;
                    ctx.fillText(this.symbol, this.x, this.y);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function createFirework(x, y) {
            for (let i = 0; i < 35; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('pointerdown', (e) => createFirework(e.clientX, e.clientY));

        document.getElementById('fab-kiss').addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = e.target.getBoundingClientRect();
            createFirework(rect.left + rect.width / 2, rect.top + rect.height / 2);
        });

        setTimeout(() => {
            createFirework(window.innerWidth / 2, window.innerHeight / 3);
        }, 500);
    </script>
</body>
</html>
