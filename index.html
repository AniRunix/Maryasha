<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- ЗАПРЕТ КЭШИРОВАНИЯ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Наша Нежная История 💕</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Marck+Script&display=swap');

        :root {
            --bg-soft: #fff0f5;
            --card-bg: rgba(255, 255, 255, 0.75);
            --pink-main: #ff758c;
            --pink-accent: #ff7eb3;
            --text-dark: #6c4f5a;
            --text-muted: #a07a8b;
            --shadow-soft: 0 10px 30px rgba(255, 117, 140, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffe6e8 0%, #fff0f3 50%, #f3e8ff 100%);
            color: var(--text-dark);
            font-family: 'Comfortaa', cursive, sans-serif;
            min-height: 100vh;
            padding: 20px 16px 80px 16px;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ПАРЯЩИЕ СЕРДЕЧКИ НА ФОНЕ --- */
        .bg-hearts {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-heart {
            position: absolute;
            color: rgba(255, 117, 140, 0.25);
            font-size: 20px;
            animation: floatUp 8s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.8) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        #hearts-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- СТАТУС --- */
        .title-badge {
            text-align: center;
            margin-top: 10px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid #ffffff;
            border-radius: 30px;
            color: var(--pink-main);
            font-weight: 700;
            font-size: 15px;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .status-pill:active {
            transform: scale(0.96);
        }

        /* --- ПРЯМОУГОЛЬНАЯ РАМКА ДЛЯ ФОТО --- */
        .photo-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 3px solid #ffffff;
            border-radius: 28px;
            padding: 16px;
            box-shadow: var(--shadow-soft);
        }

        /* Прямоугольное фото */
        .photo-rectangular {
            width: 100%;
            height: 280px;
            border-radius: 18px;
            object-fit: cover;
            display: block;
            box-shadow: 0 8px 20px rgba(108, 79, 90, 0.1);
        }

        /* Блок с аватарками под фото */
        .profiles-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 16px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
        }

        .profile-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-item img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--pink-main);
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.2);
        }

        .profile-item span {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .heart-beat {
            font-size: 18px;
            color: var(--pink-main);
            animation: heartPulse 1.2s infinite ease-in-out;
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* --- ПРОГРЕСС ЦЕЛИ --- */
        .goal-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 22px;
            padding: 16px 20px;
            box-shadow: var(--shadow-soft);
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .goal-track {
            height: 14px;
            background: #ffe3e8;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            padding: 2px;
        }

        .goal-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--pink-accent), var(--pink-main));
            border-radius: 20px;
            transition: width 0.8s ease;
        }

        /* --- ТАЙМЕР-ОБЛАЧКА --- */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .timer-cloud {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 22px;
            padding: 14px 8px;
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .timer-num {
            font-size: 24px;
            font-weight: 700;
            color: var(--pink-main);
        }

        .timer-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 600;
        }

        /* --- БОЛЬШАЯ КНОПКА-СЕРДЦЕ --- */
        .heart-button-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
        }

        .big-heart-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff7eb3 0%, #ff758c 100%);
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .big-heart-btn:active {
            transform: scale(0.88);
        }

        .heart-btn-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* --- СПИСОК СОБЫТИЙ --- */
        .events-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 28px;
            padding: 20px;
            box-shadow: var(--shadow-soft);
        }

        .events-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--pink-main);
            text-align: center;
            margin-bottom: 14px;
        }

        .events-scroll {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .events-scroll::-webkit-scrollbar { width: 4px; }
        .events-scroll::-webkit-scrollbar-thumb {
            background: var(--pink-accent);
            border-radius: 10px;
        }

        .event-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            border: 1px solid #ffeef1;
        }

        .event-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .event-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .event-date {
            font-size: 10px;
            color: var(--text-muted);
        }

        .event-badge {
            font-size: 11px;
            font-weight: 700;
            color: var(--pink-main);
            background: #ffe6eb;
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* ТОАСТ */
        .toast-bubble {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: #ffffff;
            color: var(--pink-main);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(255, 117, 140, 0.3);
            border: 2px solid var(--pink-accent);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast-bubble.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- ПАРЯЩИЕ ФОНОВЫЕ СЕРДЕЧКИ -->
    <div class="bg-hearts" id="bg-hearts"></div>

    <canvas id="hearts-canvas"></canvas>
    <div class="toast-bubble" id="toast-pop">Поцелуй отправлен! 💖</div>

    <div class="wrapper">

        <!-- СТАТУС -->
        <div class="title-badge">
            <div class="status-pill" onclick="editStatus()" title="Нажмите, чтобы изменить">
                <span>🎀</span>
                <span id="status-text">РОМА ПЁС</span>
                <span style="font-size: 10px; opacity: 0.6;">✏️</span>
            </div>
        </div>

        <!-- КАРТОЧКА С ПРЯМОУГОЛЬНЫМ ФОТО -->
        <div class="photo-card">
            <!-- Прямоугольное фото -->
            <img class="photo-rectangular" src="https://i.postimg.cc/9rLj97mm/couple-photo.jpg" alt="Наше Фото">

            <!-- Аватарки под фото -->
            <div class="profiles-row">
                <div class="profile-item">
                    <img src="https://i.postimg.cc/phMNvQZB/maryasha-avatar.png" alt="Марьяша">
                    <span>марьяша</span>
                </div>

                <div class="heart-beat">💖</div>

                <div class="profile-item">
                    <img src="https://i.postimg.cc/CZWPDFnS/roma-avatar.png" alt="Рома">
                    <span>рома</span>
                </div>
            </div>
        </div>

        <!-- ПРОГРЕСС ЦЕЛИ (50 ДНЕЙ) -->
        <div class="goal-box">
            <div class="goal-header">
                <span>Цель: 50 дней любви</span>
                <span id="goal-counter">--</span>
            </div>
            <div class="goal-track">
                <div class="goal-fill" id="goal-fill-bar"></div>
            </div>
        </div>

        <!-- ТАЙМЕР-ОБЛАЧКА -->
        <div class="timer-grid">
            <div class="timer-cloud">
                <div class="timer-num" id="years-val">0</div>
                <div class="timer-text">лет</div>
            </div>
            <div class="timer-cloud">
                <div class="timer-num" id="months-val">0</div>
                <div class="timer-text">месяцев</div>
            </div>
            <div class="timer-cloud">
                <div class="timer-num" id="days-val">0</div>
                <div class="timer-text">дней</div>
            </div>
        </div>

        <!-- КНОПКА-СЕРДЦЕ -->
        <div class="heart-button-wrapper">
            <div class="big-heart-btn" id="kiss-btn">💖</div>
            <div class="heart-btn-label">Нажми, чтобы обнять</div>
        </div>

        <!-- СПИСОК СОБЫТИЙ -->
        <div class="events-card">
            <div class="events-title">🌸 Наш Календарь Счастья</div>
            <div class="events-scroll" id="events-container">
                <!-- Заполняется динамически -->
            </div>
        </div>

    </div>

    <script>
        // ФОНОВЫЕ СЕРДЕЧКИ
        const heartsContainer = document.getElementById('bg-hearts');
        for (let i = 0; i < 12; i++) {
            const h = document.createElement('div');
            h.className = 'bg-heart';
            h.textContent = ['🌸', '💖', '✨', '💕', '🌷'][Math.floor(Math.random() * 5)];
            h.style.left = Math.random() * 100 + '%';
            h.style.animationDelay = Math.random() * 6 + 's';
            h.style.animationDuration = (Math.random() * 4 + 6) + 's';
            heartsContainer.appendChild(h);
        }

        // СТАТУС
        function loadStatus() {
            const saved = localStorage.getItem('sweet_love_status');
            if (saved) document.getElementById('status-text').textContent = saved;
        }

        function editStatus() {
            const current = document.getElementById('status-text').textContent;
            const updated = prompt("Введите новое имя или статус:", current);
            if (updated && updated.trim() !== "") {
                const val = updated.trim();
                document.getElementById('status-text').textContent = val;
                localStorage.setItem('sweet_love_status', val);
            }
        }
        loadStatus();

        // РАСЧЕТ ВРЕМЕНИ И ЦЕЛИ
        const startDate = new Date(2026, 5, 24); // 24.06.2026
        const goalTarget = 50;

        function updateTimer() {
            const now = new Date();
            const diffMs = now - startDate;
            if (diffMs < 0) return;

            const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            let y = now.getFullYear() - startDate.getFullYear();
            let m = now.getMonth() - startDate.getMonth();
            let d = now.getDate() - startDate.getDate();

            if (d < 0) {
                m--;
                const prevM = new Date(now.getFullYear(), now.getMonth(), 0);
                d += prevM.getDate();
            }
            if (m < 0) {
                y--;
                m += 12;
            }

            document.getElementById('years-val').textContent = y;
            document.getElementById('months-val').textContent = m;
            document.getElementById('days-val').textContent = d;

            // Шкала прогресса
            let currentProg = totalDays >= goalTarget ? goalTarget : totalDays;
            let pct = Math.floor((currentProg / goalTarget) * 100);
            document.getElementById('goal-fill-bar').style.width = pct + '%';

            let leftDays = goalTarget - totalDays;
            document.getElementById('goal-counter').textContent = leftDays > 0 ? `Осталось: ${leftDays}д` : `Цель достигнута! 💕`;
        }

        // СОБЫТИЯ
        const eventsData = [
            { title: "Начало истории", date: "24.06.2026", icon: "💋" },
            { title: "10 дней вместе", date: "04.07.2026", icon: "🌸" },
            { title: "30 дней вместе", date: "24.07.2026", icon: "🌸" },
            { title: "50 дней вместе", date: "13.08.2026", icon: "🌺" },
            { title: "100 дней вместе", date: "02.10.2026", icon: "💖" },
            { title: "Новый Год", date: "31.12.2026", icon: "🎄" },
            { title: "Рождество", date: "07.01.2027", icon: "✨" },
            { title: "200 дней вместе", date: "10.01.2027", icon: "💖" },
            { title: "День Святого Валентина", date: "14.02.2027", icon: "🎁" },
            { title: "1 Год Любви", date: "24.06.2027", icon: "👑" },
            { title: "5 Лет Счастья", date: "24.06.2031", icon: "💎" },
            { title: "10 Лет Вместе", date: "24.06.2036", icon: "💍" }
        ];

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';
            const now = new Date();

            eventsData.forEach(ev => {
                const parts = ev.date.split('.');
                const evDate = new Date(parts[2], parts[1] - 1, parts[0]);
                const diffDays = Math.ceil((evDate - now) / (1000 * 60 * 60 * 24));

                let tag = diffDays > 0 ? `Через ${diffDays}д` : (diffDays === 0 ? `Сегодня! 🎉` : `Пройдено ✨`);

                const row = document.createElement('div');
                row.className = 'event-row';
                row.innerHTML = `
                    <div class="event-info">
                        <span class="event-name">${ev.icon} ${ev.title}</span>
                        <span class="event-date">${ev.date}</span>
                    </div>
                    <span class="event-badge">${tag}</span>
                `;
                container.appendChild(row);
            });
        }

        updateTimer();
        renderEvents();
        setInterval(updateTimer, 60000);

        // УВЕДОМЛЕНИЯИ САЛЮТ ИЗ СЕРДЕЧЕК
        const phrases = [
            "Крепко обнимаю! 💖",
            "Ты моё самое большое счастье! 🌸",
            "Самая милая пара на свете! ✨",
            "Один нежный поцелуй отправлен! 💋"
        ];

        function showToast() {
            const t = document.getElementById('toast-pop');
            t.textContent = phrases[Math.floor(Math.random() * phrases.length)];
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2400);
        }

        // АНИМАЦИЯ СЕРДЕЧЕК ПРИ КЛИКЕ
        const canvas = document.getElementById('hearts-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class HeartParticle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = Math.random() * 16 + 10;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6 - 2;
                this.color = ['#ff758c', '#ff7eb3', '#ffaaa5', '#ffd3b6'][Math.floor(Math.random() * 4)];
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.font = `${this.size}px serif`;
                ctx.fillText('♥', this.x, this.y);
                ctx.restore();
            }
        }

        function burstHearts(x, y) {
            for (let i = 0; i < 25; i++) particles.push(new HeartParticle(x, y));
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        document.getElementById('kiss-btn').addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            burstHearts(rect.left + rect.width / 2, rect.top + rect.height / 2);
            showToast();
        });

        window.addEventListener('pointerdown', (e) => {
            if (!e.target.closest('.status-pill') && !e.target.closest('.big-heart-btn')) {
                burstHearts(e.clientX, e.clientY);
            }
        });
    </script>
</body>
</html>
